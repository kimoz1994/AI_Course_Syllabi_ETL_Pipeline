# ============================================================
# Schema contract - canonical vocabularies + synonym alias map
#
# Source of truth: `reference/form questions .txt` (the original
# Google-Form spec), NOT the legacy CSV export - the CSV's
# `Short Quizes` spelling was a transcription artifact.
#
# The extraction backend may emit near-variant wording (`lecture`,
# `lecture-based`, ...); the alias map below normalizes every
# vocabulary value to its canonical form before the dataset is
# written. `not mentioned` needs no alias: it normalizes to null.
# A value that has no alias, is not canonical, and is not
# `Other/not clear` is *unmappable*: it is surfaced in the
# extraction log and the validation stage fails the run on it.
#
# Maintain this file, never code: add aliases as new variants
# appear. Matching is case- and whitespace-insensitive.
# ============================================================

vocabularies:
  # Single-choice field: exactly one value (or null).
  course_level:
    - School
    - Undergraduate
    - Master
    - PhD
    - not mentioned
    - Other/not clear
  # Multi-choice fields: one or more values per syllabus.
  teaching_method:
    - Collaborative or Group-based learning
    - Lecture based learning
    - "Project based learning (i.e., team project)"
    - Learning using case study
    - Flipped classroom
    - LAB demos
    - Seminar
    - Workshop
    - Online course
    - "Hybrid learning (face-to-face and online)"
    - not mentioned
    - Other/not clear
  assessment_methods:
    - Short Quizzes
    - Assignments
    - Final Exam
    - Midterm Exam
    - Project
    - Attendance or participation
    - Presentation
    - Report
    - not mentioned
    - Other/not clear

