# ============================================================
# AI Course Syllabi ETL - pipeline configuration
# All paths are resolved relative to this file's directory.
# ============================================================

input: data/pdfs                           # a folder of syllabus PDFs (the only input)
# schema_contract: schema_contract.yaml      # optional: canonical vocabularies + alias map

paths:
  output: output                            # dataset + extraction log (committed)

# Extraction backend for the PDF flow: mock | llm
#   mock - canned records (offline tests/CI)
#   llm  - any OpenAI-compatible chat server (LM Studio / Ollama / vLLM / cloud);
#          driven by the `llm` block below. Invalid output is retried up to
#          llm.max_retries times, then the file yields an all-null record +
#          warning so the run completes with the failure visible.
extraction_backend: mock

# Bloom's Taxonomy verb table (one verb per line) for the llm extraction
# backend's course-outcomes rule. Derived from the owner's reference table.
bloom_verbs: prompts/bloom_verbs.txt

llm:                                        # extraction (extraction_backend == llm)
  base_url: http://localhost:1234/v1        # LM Studio default; Ollama uses http://localhost:11434/v1
  model: lmstudio-community/Meta-Llama-3-8B-Instruct-GGUF
  api_key_env: LMSTUDIO_API_KEY             # env var holding the key (local servers accept any value)
  temperature: 0.0
  timeout_seconds: 60
  max_retries: 3
  structured_output: false                  # true = send an OpenAI json_schema response_format that
                                            #   forces the 14-field JSON shape (LM Studio supports it;
                                            #   servers without structured-output support reject it)

# --- dormant (legacy CSV flow, retired; classification revives later) ------
# These keys belong to the retired table pipeline (extract/clean/load/report
# in data/archive's README) and to topic classification, which stays in the
# codebase but off the v1 run path (deferred ticket). They are kept so the
# dormant modules stay runnable for development; the v1 flow reads none of
# them. Defaults for all of them live in src/ai_syllabi_etl/config.py.
#
# backend: rule                # classification backend: rule | openai | mock
# taxonomy: taxonomy/aima_taxonomy.json
# prompt: prompts/classify_topics.md
# paths.processed: data/processed
# validation: {min_year, max_year, min_topic_coverage, required_columns}
# report: {top_n_methods}
# llm.fallback_to_rule: true   # classification-only graceful degradation
