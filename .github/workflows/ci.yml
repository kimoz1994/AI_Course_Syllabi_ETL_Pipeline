name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install -e ".[pdf]"

      - name: Static checks (syntax / undefined names)
        run: |
          python -m pip install ruff
          ruff check --select E9,F63,F7,F82 src tests

      - name: Unit + end-to-end tests
        run: python -m unittest discover -s tests -v

      - name: Smoke run (offline rule backend)
        run: python -m ai_syllabi_etl run --backend rule

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-py${{ matrix.python-version }}
          path: |
            output/
            data/processed/quality_report.json
          if-no-files-found: ignore
